analysis:
  # Threshold for retaining edges in plots (mean + n * std)
  # signal graph threshold
  threshold_std: 0
  # module graph threshold
  module_threshold_offset: 0

# Fault diagnosis configuration
# Set healthy_result_dir / faulty_result_dir to the experiment folders
# you want to compare (output of iTransformer training runs).
diagnosis:
  healthy_result_dir: "./results/healthy_baseline"
  faulty_result_dir:  "./results/unhealthy_test"
  drift_threshold: 0.01
  spectral_drift_threshold: 0.01
  top_k: 20  # top-k evidences
  tracing_top_k: 3        # Number of backward start points
  max_bfs_branches: 3     # BFS max branches per node
  path_threshold: 0.03    # Minimum edge strength to follow
  max_depth: 3            # Maximum hops to trace back